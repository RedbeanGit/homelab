apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sftpgo
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./flux/apps/sftpgo
  targetNamespace: silicon-rs
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
